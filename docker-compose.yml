services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-eap}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-eap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:pass@postgres:5432/eap}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_KEY: ${MINIO_KEY:-minioadmin}
      MINIO_SECRET: ${MINIO_SECRET:-minioadmin}
      MAAS_BASE_URL: ${MAAS_BASE_URL:-http://maas:8100}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-http://sandbox:8200}
      APP_SECRETS_DIR: /data/secrets
      AUTO_GENERATE_SECRETS: "true"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
    volumes:
      - app_secrets:/data/secrets
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      maas:
        condition: service_started
      sandbox:
        condition: service_started

  maas:
    build:
      context: ./maas
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:pass@postgres:5432/eap}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRETS_DIR: /data/secrets
      AUTO_GENERATE_SECRETS: "true"
      PRODUCTION_MODE: ${PRODUCTION_MODE:-true}
    volumes:
      - app_secrets:/data/secrets
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sandbox:
    build:
      context: ./sandbox
    ports:
      - "8200:8200"

  frontend:
    build:
      context: ./frontend
    ports:
      - "18080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  app_secrets:
