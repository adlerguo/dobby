services:
  cockpit-postgres:
    image: pgvector/pgvector:pg15
    container_name: cockpit-postgres
    restart: always
    networks:
      - wanwu-net
    # 调试期如需宿主机直连数据库，可临时打开下一行；默认不暴露端口。
    # ports:
    #   - "15432:5432"
    volumes:
      - cockpit_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  cockpit-service:
    build:
      context: ./cockpit
    container_name: cockpit-service
    restart: always
    networks:
      - wanwu-net
    expose:
      - "18081"
    depends_on:
      cockpit-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cockpit:cockpit@cockpit-postgres:5432/cockpit
      JWT_SIGNING_KEY: ${WANWU_BFF_JWT_SIGNING_KEY}
      WANWU_BFF_BASE_URL: http://bff-service:6668
      WANWU_SVC_USERNAME: ${WANWU_SVC_USERNAME:-}
      WANWU_SVC_PASSWORD: ${WANWU_SVC_PASSWORD:-}
      WANWU_SVC_TOKEN: ${WANWU_SVC_TOKEN:-}
      WANWU_SVC_CAPTCHA_KEY: ${WANWU_SVC_CAPTCHA_KEY:-}
      WANWU_SVC_CAPTCHA_CODE: ${WANWU_SVC_CAPTCHA_CODE:-}
      EVAL_TIMEOUT_SECONDS: ${EVAL_TIMEOUT_SECONDS:-120}
      EVAL_DEFAULT_CONCURRENCY: ${EVAL_DEFAULT_CONCURRENCY:-2}
      EXPERIENCE_EMBEDDING_DIM: ${EXPERIENCE_EMBEDDING_DIM:-1024}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:18081/api/v1/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  wanwu-net:
    external: true

volumes:
  cockpit_postgres_data:
