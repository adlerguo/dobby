[pytest]
markers =
    integration: requires a running docker compose stack and explicit smoke-test environment variables
    postgres: requires a running PostgreSQL database
    computer_use_unit: Computer Use unit tests
    computer_use_security: Computer Use security policy tests
    computer_use_integration: Computer Use integration tests
    playwright: requires Playwright browser runtime
    unit: fast unit tests
    external_service: requires a real external service
    slow: slower integration-style tests
